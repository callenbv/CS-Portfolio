  <form class="contact-form" id="contactForm">
    <div class="message-box-wrapper">
      <div class="contact-field-row">
        <div class="contact-field"><label for="nameText">Name</label><input id="nameText" name="name" autocomplete="name" required maxlength="120"></div>
        <div class="contact-field"><label for="emailText">Email</label><input id="emailText" name="email" type="email" autocomplete="email" required maxlength="254"></div>
      </div>
      <div class="contact-field"><label for="subjectText">Subject <span class="optional">(optional)</span></label><input id="subjectText" name="subject" maxlength="200"></div>
      <div class="contact-field"><label for="messageText">Message</label><textarea id="messageText" name="message" rows="6" required maxlength="10000"></textarea></div>
      <button id="sendButton" class="send-button" type="submit">Send message</button>
      <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
    </div>
  </form>
